# Workflow Catalog — Unity Mobile Puzzle profile
# Used by /help to determine where a user is and what comes next.
#
# Artifact checks:
#   glob: file glob pattern — complete if ≥1 file matches (or min_count)
#   pattern: text pattern that must appear in the file (checked after glob)
#   min_count: minimum matching files required (default: 1)
#   note: human-readable fallback when completion can't be auto-detected
#
# required: true → blocks progression to next phase (shown as REQUIRED)
# required: false → optional enhancement (shown as OPTIONAL)
# repeatable: true → runs multiple times (one per system, story, etc.)
#
# Phase gates (/gate-check): verdicts are ADVISORY — they guide the decision
# but never hard-block advancement. The user always decides whether to proceed.
#
# ─── PROFILE NOTE ────────────────────────────────────────────────────────────
# This profile deliberately front-loads a playable build. Exactly TWO artifacts
# gate the first line of gameplay code:
#
#   1. .claude/docs/technical-preferences.md   (conventions + budgets)
#   2. design/gdd/game-concept.md              (what the game is)
#
# The MVP phase then PRODUCES the third — production/mvp-report.md — which is the
# artifact that gates everything after it.
#
# Art bible, UX specs, accessibility requirements, control manifest, per-system
# GDDs, cross-GDD review, and architecture review are all real work — they are
# simply sequenced AFTER the MVP verdict, because a mechanic that does not work
# makes all of them wasted. Nothing was deleted; the order changed.
#
# The MVP phase is where this profile differs most from a general game workflow.
# Its output code is KEPT. Production continues from it rather than replacing it.

phases:

  concept:
    label: "Concept"
    description: "Establish conventions and decide what the game is"
    next_phase: mvp
    steps:
      - id: engine-setup
        name: "Engine & Conventions"
        command: /setup-engine
        required: true
        artifact:
          glob: ".claude/docs/technical-preferences.md"
          pattern: "Engine.*Unity"
        description: "Record engine capability, platform, input, naming, budgets, forbidden patterns. Versions are NOT pinned — they are decided at the moment of use."

      - id: brainstorm
        name: "Brainstorm"
        command: /brainstorm
        required: false
        description: "Explore the concept using MDA, verb-first framing, and player psychology. Skip if the concept is already clear."

      - id: game-concept
        name: "Game Concept Document"
        command: /brainstorm
        required: true
        artifact:
          glob: "design/gdd/game-concept.md"
        description: "Formalise the concept: core loop, pillars, target player, scope tiers. This is the input to the MVP, so it must name the mechanic precisely."

      - id: art-bible
        name: "Art Bible"
        command: /art-bible
        required: false
        description: "Visual identity specification. OPTIONAL before the MVP — a demo needs no final art. Becomes REQUIRED before asset production begins in earnest."

  mvp:
    label: "MVP"
    description: "Build something playable and judge it. This code is kept."
    next_phase: systems-design
    steps:
      - id: mvp-demo
        name: "MVP — demo mode"
        command: /puzzle-mvp --mode demo
        required: true
        artifact:
          glob: "production/mvp-report.md"
          pattern: "Mode.*demo"
        description: "Single scene, Null adapters, no SDKs, 3-5 hand-built levels. Answers one question: is this mechanic worth building? Ends in PROCEED / PIVOT / KILL."

      - id: mvp-verdict
        name: "MVP Verdict Gate"
        command: /gate-check
        required: true
        artifact:
          note: "production/mvp-report.md must carry a PROCEED verdict to continue. PIVOT re-runs the demo; KILL returns to /brainstorm."
        description: "KILL and PIVOT are successful outcomes of this phase, not failures. Three PIVOTs on one concept forces a KILL decision."

      - id: level-pipeline
        name: "Level Pipeline Decision"
        command: /level-pipeline
        required: true
        artifact:
          glob: "docs/architecture/adr-*level*.md"
        description: "Now that the mechanic is known, decide how levels are authored, stored, ordered, and validated. Produces an ADR and scaffolds the loader plus a validity checker. Running this before the mechanic is settled is a guess."

      - id: sdk-consent
        name: "Consent Adapter"
        command: /sdk-integrate consent
        required: true
        artifact:
          glob: "docs/registry/services.yaml"
          pattern: "interface: IConsentService[\\s\\S]*?adapter_status: exists"
        description: "GDPR consent + iOS App Tracking Transparency. MUST come before ads — it is a store-submission gate, and the upstream ad contract does not enforce it for you."

      - id: sdk-ads-tracking
        name: "Ads & Tracking Adapters"
        command: /sdk-integrate ads tracking
        required: true
        artifact:
          glob: "docs/registry/services.yaml"
          pattern: "interface: IAdsProvider[\\s\\S]*?adapter_status: exists"
        description: "Write adapters from the existing CuOCore contracts onto the in-house SDK wrappers. Check the registry first — never write a parallel interface."

      - id: feature-flags
        name: "Feature Flags"
        command: /feature-flag
        required: true
        artifact:
          glob: "docs/registry/feature-flags.yaml"
          pattern: "^  - event_id:"
        description: "Every switchable feature gets a flag across all three places. Ads and IAP each require a kill-switch. Default anything unproven to off."

      - id: mvp-signal
        name: "MVP — signal mode"
        command: /puzzle-mvp --mode signal --from-demo
        required: false
        artifact:
          glob: "production/mvp-report.md"
          pattern: "Mode.*signal"
        description: "Promote the demo: three scenes from the upstream sample, real adapters, persistent progress, safe-area HUD. Produces a soft-launch build. OPTIONAL — skip only if you are certain you do not want a market read before committing to Production."

  systems-design:
    label: "Systems Design"
    description: "Document the systems the MVP proved, plus the meta systems it deferred"
    next_phase: technical-setup
    steps:
      - id: design-system
        name: "System GDDs"
        command: /design-system
        required: true
        repeatable: true
        artifact:
          note: "One GDD per MVP-tier system. The MVP report's deferred-scope table lists what still needs designing."
        description: "Author per-system GDDs, section by section. Scope to MVP-tier systems only — the MVP already told you which ones matter."

      - id: review-all-gdds
        name: "Cross-GDD Review"
        command: /review-all-gdds
        required: true
        artifact:
          glob: "design/gdd/gdd-cross-review-*.md"
        description: "Holistic consistency and design-theory review across all GDDs at once. Catches dominant strategies, economic imbalance, and pillar drift."

      - id: monetization
        name: "Monetisation Design"
        command: /design-system
        required: false
        artifact:
          glob: "design/gdd/monetization.md"
        description: "Offers, currencies, ad placements, pricing. REQUIRED before a monetised release; optional if the MVP signal run has not happened yet."

      - id: ux-design
        name: "UX Specs"
        command: /ux-design
        required: false
        repeatable: true
        artifact:
          glob: "design/ux/*.md"
        description: "Per-screen specs. The MVP already produced working screens, so this documents and refines rather than inventing. Becomes REQUIRED before a polish pass."

  technical-setup:
    label: "Technical Setup"
    description: "Record the architecture the MVP established, and fix the boundaries"
    next_phase: production
    steps:
      - id: create-architecture
        name: "Architecture Document"
        command: /create-architecture
        required: true
        artifact:
          glob: "docs/architecture/architecture.md"
        description: "Document the architecture as built. The MVP made these decisions in code; this makes them reviewable and explains why."

      - id: architecture-decision
        name: "Architecture Decisions (ADRs)"
        command: /architecture-decision
        required: true
        repeatable: true
        artifact:
          glob: "docs/architecture/adr-*.md"
          min_count: 4
        description: "Minimum four: (1) adapter boundary, (2) feature-flag mechanism including kill-switch latency, (3) level pipeline, (4) SO event channel strategy. The level pipeline ADR is already written in the MVP phase."

      - id: test-setup
        name: "Test Framework & CI"
        command: /test-setup
        required: false
        artifact:
          note: "Check tests/ for the EditMode + PlayMode structure and a CI workflow"
        description: "Formalise the test structure the MVP started. PlayMode coverage is required by test-standards.md — all four reference titles have zero, and each paid for it."

  production:
    label: "Production"
    description: "Sprint-based development on top of the MVP code"
    next_phase: polish
    steps:
      - id: create-epics
        name: "Create Epics"
        command: /create-epics
        required: true
        repeatable: true
        artifact:
          glob: "production/epics/*/EPIC.md"
          min_count: 1
        description: "One epic per architectural module. The MVP report's deferred-scope table is the starting backlog."

      - id: create-stories
        name: "Create Stories"
        command: /create-stories
        required: true
        repeatable: true
        artifact:
          glob: "production/epics/**/*.md"
          min_count: 2
        description: "Break each epic into implementable stories with embedded requirements and acceptance criteria."

      - id: sprint-plan
        name: "Sprint Plan"
        command: /sprint-plan
        required: true
        repeatable: true
        artifact:
          glob: "production/sprints/sprint-*.md"
        description: "Plan the sprint with prioritised, ready stories."

      - id: implement
        name: "Implement Stories"
        command: /dev-story
        required: true
        repeatable: true
        artifact:
          note: "Check Assets/Scripts/ for active code and production/epics/**/*.md for In Progress stories"
        description: "Implement the next ready story. Routes to the correct specialist — service work goes to mobile-sdk-engineer first."

      - id: code-review
        name: "Code Review"
        command: /code-review
        required: false
        repeatable: true
        description: "Architectural review after each story. Checks the adapter boundary, assembly structure, and file-size ceilings."

      - id: story-done
        name: "Story Done Review"
        command: /story-done
        required: true
        repeatable: true
        description: "Verify acceptance criteria, check for GDD/ADR deviation, close the story."

      - id: flag-audit
        name: "Feature Flag Audit"
        command: /feature-flag audit
        required: false
        repeatable: true
        description: "Find flags read but never declared, catalog entries silently deleted, and ads/IAP flags missing a kill-switch. Run at sprint close and before any release."

      - id: mobile-build-check
        name: "Mobile Build Check"
        command: /mobile-build-check
        required: false
        repeatable: true
        description: "Static pre-flight before handing a branch to CI: adapter boundary, consent gate, assembly structure, secrets, flag declarations."

      - id: qa-plan
        name: "QA Plan"
        command: /qa-plan
        required: false
        repeatable: true
        description: "Test plan per epic or sprint. Produces the cases used by smoke checks and regression coverage."

      - id: retrospective
        name: "Sprint Retrospective"
        command: /retrospective
        required: false
        repeatable: true
        description: "Capture what worked and what to change, at the end of each sprint."

  polish:
    label: "Polish"
    description: "Performance, balance, device testing, bug fixing"
    next_phase: release
    steps:
      - id: perf-profile
        name: "Performance Profile"
        command: /perf-profile
        required: true
        description: "Profile against the mobile budgets on real devices across the three device tiers. Editor profiling hides mobile cost — it does not satisfy this step."

      - id: balance-check
        name: "Balance Check"
        command: /balance-check
        required: false
        description: "Analyse difficulty curve, economy, and progression for outliers and degenerate strategies."

      - id: tech-debt
        name: "Tech Debt Pass"
        command: /tech-debt
        required: false
        description: "Pay down the debt the MVP report listed deliberately, plus dead code, orphaned defines, and unused packages."

      - id: playtest
        name: "Playtest Sessions"
        command: /playtest-report
        required: true
        artifact:
          glob: "production/playtests/*.md"
          min_count: 2
        description: "Cover the new-player experience and the mid-game difficulty curve at minimum."

      - id: team-polish
        name: "Polish Team Pass"
        command: /team-polish
        required: false
        description: "Coordinated pass across performance, audio, visual, and UX."

  release:
    label: "Release"
    description: "Store readiness and ship"
    next_phase: null
    steps:
      - id: release-checklist
        name: "Release Checklist"
        command: /release-checklist
        required: true
        description: "Pre-release validation across code, content, store metadata, and legal. Includes the consent and privacy declarations."

      - id: flag-audit-release
        name: "Release Flag Audit"
        command: /feature-flag audit
        required: true
        description: "Every ads and IAP flag has a kill-switch, every flag read is declared, and the kill-switch latency is documented. A monetised build without this cannot be turned off after release."

      - id: changelog
        name: "Changelog / Patch Notes"
        command: /changelog
        required: false
        description: "Generate internal and player-facing notes from commits and sprint data."

      - id: hotfix
        name: "Hotfix (as needed)"
        command: /hotfix
        required: false
        repeatable: true
        description: "Emergency fix workflow with an audit trail, bypassing the normal sprint process."
