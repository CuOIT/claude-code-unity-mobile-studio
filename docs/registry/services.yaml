# ─── CONTRACTS ALREADY SATISFIED ─────────────────────────────────────────────
# Contracts CuOCore fully implements. Listed so nobody rebuilds them.
# These need no adapter — consume them directly.

satisfied_upstream:
  - interface: IServiceRegistry
    package: com.cuongbs.utilities
    capability: "Manual singleton registration, lock-then-bootstrap lifecycle"
  - interface: IEventChannel
    package: com.cuongbs.utilities
    capability: "ScriptableObject event channels — the project's cross-module event mechanism"
  - interface: IPoolService
    package: com.cuongbs.pooling
    capability: "Object pooling with preload, max size, IPoolable hooks"
  - interface: IInventoryService
    package: com.cuongbs.resources
    capability: "Currency and skin-unlock state, enum-keyed, persisted"
  - interface: ISceneFlowService
    package: com.cuongbs.sceneflow
    capability: "Async scene transition plus a boot step/condition pipeline"
  - interface: IGameplayFlowService
    package: com.cuongbs.gameplayflow
    capability: "In-level state machine with lose/exit/post-win policies"
  - interface: IUIElement
    package: com.cuobs.ui
    capability: "Type-keyed screen/popup manager with per-type instance pooling"
  - interface: IAudioService
    package: com.cuongbs.audio
    capability: "Music and SFX with buses, voice pooling, ducking, volume persistence"
  - interface: IHapticService
    package: com.cuongbs.haptics
    capability: "Haptic presets and custom patterns with capability probing"
  - interface: ICloudStorageProvider
    package: com.cuongbs.syncdata
    capability: "Cloud save with conflict resolution and a boot-apply gate"
