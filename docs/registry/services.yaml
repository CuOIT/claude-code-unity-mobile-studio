    adapter_target: "InventoryService from com.cuongbs.resources"
    vendor: ""
    define_symbol: ""
    null_impl: ""
    bootstrap_order: 80
    gates_ads: false
    test_assembly: CuongBS.Boosters.Tests
    adr: ""
    notes: "Both packages exist; nothing upstream bridges them. Small, well-defined adapter."
    added: 2026-08-21
    revised: ""

  - interface: IHeartService
