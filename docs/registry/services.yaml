  - interface: ITrustedTimeResponseParser
    status: active
    package: com.cuongbs.trustedtime
    capability: "Parse a server time response, for clock-tamper resistance"
    adapter_status: missing
    adapter_target: "parser matching whichever time endpoint is chosen"
    vendor: ""
    define_symbol: ""
    null_impl: ""
    bootstrap_order: 20
    gates_ads: false
    test_assembly: CuongBS.TrustedTime.Tests
    adr: ""
