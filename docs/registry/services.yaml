  - interface: HomeFlowStepSO
    status: active
    package: com.cuongbs.homeflow
    capability: "One step in the home-screen popup sequence, with category and quota"
    adapter_status: missing
    adapter_target: "one subclass per popup"
    vendor: ""
    define_symbol: ""
    null_impl: "test step subclass"
    bootstrap_order: 95
    gates_ads: false
    test_assembly: Homeflow.Tests
    adr: ""
    notes: >
      Abstract base, not an interface. A shipped title has 61 concrete steps. Note the
