    vendor: ""
    define_symbol: ""
    null_impl: "sample session"
    bootstrap_order: 90
    gates_ads: false
    test_assembly: ""
    adr: ""
    added: 2026-08-21
    revised: ""

  - interface: IGameplayLevelProvider
    status: active
    package: com.cuongbs.gameplayflow
    capability: "Current level and next-level resolution, persisted across sessions"
    adapter_status: missing
    adapter_target: "persistent provider backed by the inventory/save layer"
    vendor: ""
    define_symbol: ""
    null_impl: "sample provider — in-memory, increments without bound"
    bootstrap_order: 85
    gates_ads: false
    test_assembly: ""
    adr: ""
    notes: >
      The sample never persists and never stops. A real provider needs persistence, a
      content bound, and a defined behaviour past the last authored level. Shipped
      titles wrap around into an earlier range — decide that behaviour explicitly.
    added: 2026-08-21
    revised: ""

  - interface: IBoosterResourcePort
    status: active
    package: com.cuongbs.boosters
    capability: "Read booster quantity and consume one, for the booster use pipeline"
