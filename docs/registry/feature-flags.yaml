# ─── DEFINE SYMBOLS ──────────────────────────────────────────────────────────
# Compile-time tier. These strip code out of the build rather than toggling behaviour.
# Record the CANONICAL spelling — shipped titles in this studio carry a misspelled
# define replicated across three projects, and this section is how that stops.
#
# Required fields: symbol, status, capability, platforms[], when_absent, added

define_symbols: []

# Example:
#
# define_symbols:
#   - symbol: GAME_ENABLE_SDK
#     status: active
#     capability: "Master switch for ads, IAP, and tracking adapters"
#     platforms: [Android, iOS]
#     when_absent: "Null adapters are registered; the game runs fully with no SDKs"
#     added: 2026-08-21
#     revised: ""


# ─── RETIRED ─────────────────────────────────────────────────────────────────
# Flags no longer read by any code. Kept so an id is never reused.
# Moving a flag here REQUIRES that its readers were deleted in the same change.

retired: []
